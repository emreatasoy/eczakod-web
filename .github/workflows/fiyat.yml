# Fiyat listesini her gece ilacfiyati.com'dan (site sahibinin izniyle) günceller ve yayınlar:
#   https://emreatasoy.github.io/eczakod-web/fiyat/fiyatlar.json
#   https://emreatasoy.github.io/eczakod-web/fiyat/surum.json
# Elle çalıştırmak: Actions → Fiyat listesi → Run workflow.
name: Fiyat listesi

on:
  schedule:
    # Her gün 05:23 (TSİ = 02:23 UTC); eczaneler açılmadan liste güncel olsun. Saat başı GitHub'da çok yoğun,
    # işler saatlerce gecikiyordu; saat başı olmayan dakika daha az gecikir (yine de garanti değil).
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fiyat
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Siteyi tara (saniyede bir sayfa, ~2 saat)
        run: python tools/ilacfiyati_cek.py --cikti ham

      - name: Listeyi güncelle
        run: python tools/fiyat_guncelle.py ham/ilacfiyati.jsonl

      - name: Yayınla
        run: |
          if git diff --quiet -- fiyat; then
            echo "Değişiklik yok"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add fiyat/fiyatlar.json fiyat/surum.json
          MSG=$(python -c 'import json;c=json.load(open("fiyat/surum.json"))["changes"];print("yeni %d, fiyatı değişen %d, çıkan %d" % (c["added"], c["priceChanged"], c["removed"]))')
          git commit -m "Fiyat listesi $(date +%Y-%m-%d): $MSG"
          # Tarama sürerken repoya başka commit gelmiş olabilir (2 saat); üstüne alıp gönder.
          git pull --rebase
          git push
